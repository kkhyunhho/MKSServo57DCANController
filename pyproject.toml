[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
# Standalone test-harness variant of the MKS driver. Shares the import
# name `mks_motor` with ESP32S3BOX3MotorController's driver, so the two
# are NOT co-installed in the shared `sdl` env — run this one from an
# isolated env or via `PYTHONPATH=src` (see CLAUDE.md).
name = "mks_motor_standalone"
version = "0.1.0"
description = "Standalone single-axis MKS SERVO57D CAN test harness (no ESP32 firmware)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "kkhyunhho" }]
dependencies = [
    "ftd2xx>=1.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mks_motor"]

[tool.ruff]
line-length = 80
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/mks_motor"]

[[tool.mypy.overrides]]
module = "ftd2xx.*"
ignore_missing_imports = true
